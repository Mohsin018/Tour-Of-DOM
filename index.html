<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Of DOM</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        h1{
            color: aqua;
        }


        #food-title{
            color: blue;
        }


    </style>
</head>
<body>
    <header>
        <h1>This is my header</h1>
    </header>
    <main>
        <!-- <h1>Welcome to my DOM</h1>
        <ul>
            <li>Shafayet</li>
            <li>Bonobash</li>
            <li>Jalali Set</li>
        </ul> -->

        <section>
            <h1>Welcome to my DOM</h1>
        <ul>
            <li>Shafayet</li>
            <li>Bonobash</li>
            <li id="boss">Jalali Set</li>
        </ul>
        </section>


        <section>
            <h1 id="food-title">Foods I love</h1>
            <ul>
                <li>Rice</li>
                <li>Potato</li>
                <li>Fish</li>
                <li class="foreign">Lentils</li>
                <li class="foreign">Burger</li>
                <li class="foreign">Pizza</li>
                <li>Pasta</li>
            </ul>
        </section>
    </main>
    <script>
        // console.log('Welcome to Javascript')
        // console.log('Hello')
        // console.log('DOM-Document object Model')
        const student = {
            name: 'abul',
            id: 121,
            study: function (subject){
                // console.log('subject i study is :', subject);

            }
        }

        // document.getElementsByTagName

        const liCollection = document.getElementsByTagName('li');
        console.log(liCollection);

        for(const li of liCollection){
            console.log(li.innerText);
        }



        //get by id in dom
        const foodTitleH1 = document.getElementById('food-title');
        console.log(foodTitleH1.innerText);
        foodTitleH1.innerText = 'Food i love to eat';


        //li get accessed by dom
        const getLi = document.getElementById('boss');
        getLi.innerText = 'jalali rocks';


        //get by an class name

        const getClass = document.getElementsByClassName('foreign');
        console.log(getClass);
        console.log(getClass[0].innerText);

        //or you can use a for loop

        for(const liClass of getClass ){
            // console.log(liClass);
            console.log(liClass.innerText);
        }




        //all h1 tags
        const allHeadings = document.getElementsByTagName('h1');
        for(const heading of allHeadings){
            console.log(heading.innerText);
        }
    </script>
    <script src="js/hello.js"></script>
</body>
</html>
